services:
  - type: web
    name: boston-aerospace-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/ping
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_EMBED_MODEL
        value: text-embedding-3-small
